name: myyolo
description: |
  Beobachteter mySIGN-Browser-API-Vertrag, den myyolo-cli nutzt. Die Remote-API
  verwendet JSON-POST-Anfragen sowohl für die Authentifizierung als auch für
  eine semantisch read-only Snapshot-Operation. Generierte Ausgabe ist nur
  Referenz: Die ausgelieferte CLI behält ihre handgeschriebene
  Anfrage-Allowlist, Schlüsselbund-Integration, Anfrage-Budgets und die
  State-Machine mit genau einem erneuten Login.
version: "0.1.0"
base_url: "https://sign.azh-myyolo.info"
spec_source: browser-sniffed

auth:
  type: none
  header: ""
  format: ""
  env_vars: []

config:
  format: toml
  path: "~/.config/myyolo-pp-cli/config.toml"

resources:
  session:
    description: mySIGN-Sitzung aufbauen und den rotierenden Anfrage-Token holen.
    endpoints:
      login:
        method: POST
        path: "/Home/LoginUser"
        description: |
          Authentifiziert einen partnerbezogenen Benutzer. Passworteingabe muss
          ohne Terminal-Echo erfolgen und darf von der Produktions-CLI niemals
          als Kommandozeilenargument akzeptiert werden.
        body:
          - name: username
            type: string
            required: true
            description: mySIGN-Benutzername.
          - name: password
            type: string
            required: true
            description: Sensibles mySIGN-Passwort; niemals loggen oder außerhalb des OS-Schlüsselbunds speichern.
          - name: partnerNumber
            flag_name: partner-number
            type: string
            required: true
            description: Partnernummer, die das mySIGN-Konto eingrenzt.
        response:
          type: object
          item: LoginResponse

  snapshots:
    description: Aktuellen Snapshot zu Kurs, Anwesenheit, Mitglied und Verordnung lesen.
    endpoints:
      get_list_data:
        method: POST
        path: "/Home/GetListData"
        description: |
          Semantisch read-only Snapshot-Anfrage. nextRequestToken rotiert und
          muss den mit der Anfrage gesendeten Token ersetzen.
        body:
          - name: nextRequestToken
            flag_name: next-request-token
            type: string
            required: true
            description: Undurchsichtiger rotierender Sitzungs-Token; als Geheimnis behandeln.
        response:
          type: object
          item: Snapshot

types:
  LoginResponse:
    fields:
      - name: nextRequestToken
        type: string
      - name: rsaPublicKey
        type: object
  Snapshot:
    fields:
      - name: nextRequestToken
        type: string
      - name: KursBuchungen
        type: array
      - name: KursTeilnehmer
        type: array
      - name: Mitglieder
        type: object
      - name: Verordnungen
        type: object
