name: myyolo-admin
description: |
  Bereinigter klassischer ASP-Verwaltungsvertrag, den myyolo-cli nutzt. Die
  Produktions-Runtime folgt Weiterleitungen manuell, hält Cookies im
  OS-Schlüsselbund und erlaubt nur die hier gelisteten exakten Lese-Routen.
version: "0.3.0"
base_url: "https://www.azh-myyolo.info"
spec_source: browser-sniffed

auth:
  type: none
  header: ""
  format: ""
  env_vars: []

config:
  format: toml
  path: "~/.config/myyolo-admin-pp-cli/config.toml"

resources:
  session:
    description: Autorisierte klassische ASP-Verwaltungssitzung aufbauen.
    endpoints:
      login:
        method: POST
        path: "/Anmelden.asp?vw="
        description: |
          Form-kodiertes Login. Die Produktions-CLI zählt die beobachteten
          Weiterleitungssprünge über LoginHandler.asp und Start.asp explizit.
        body:
          - name: PartnerNummer
            flag_name: partner-number
            type: string
            required: true
          - name: Benutzername
            flag_name: username
            type: string
            required: true
          - name: Password
            flag_name: password
            type: string
            required: true
            description: Sensibel; wird niemals als Produktions-CLI-Argument akzeptiert.
        response:
          type: string

  attendance:
    description: Autorisierte, semantisch read-only aggregierte HTML-Seiten.
    endpoints:
      current:
        method: GET
        path: "/Anwesenheit/Anwesend_Aktuell_Liste.asp"
        response:
          type: string
      today:
        method: GET
        path: "/Anwesenheit/Anwesend_Heute_Liste.asp"
        response:
          type: string
      dated:
        method: GET
        path: "/Anwesenheit/Anwesend_Datum_Liste.asp"
        response:
          type: string
      reha_dated:
        method: GET
        path: "/Anwesenheit/Reha_Anwesend_Datum_Liste.asp"
        response:
          type: string

  statistics:
    description: Autorisierte Aggregatstatistiken und Unterschriften-Arbeitslisten.
    endpoints:
      course_participation_monthly:
        method: GET
        path: "/Statistiken/Kursplaner/Kurs_Teilnehmer_anwesend_monatlich.asp"
        response:
          type: string
      missing_reha_signatures:
        method: GET
        path: "/Vertrag_Reha/Unterschrift/Fehlende_Reha_Unterschriften_Liste.asp"
        response:
          type: string

  courses:
    description: Repräsentative Kurscontrolling-Lesezugriffe.
    endpoints:
      definitions:
        method: GET
        path: "/Kursplaner/Kurse_Liste.asp"
        response:
          type: string
      history:
        method: GET
        path: "/Statistiken/Kursplaner/Kurs_Teilnehmer_anwesend_Kurs.asp"
        query:
          - name: KursID
            flag_name: course-id
            type: string
            required: true
        response:
          type: string

  members:
    description: Repräsentative personenbezogene Lesezugriffe; Produktion verlangt eine explizite Personen-Daten-Freigabe.
    endpoints:
      detail:
        method: GET
        path: "/Mitglieder/Mitglied_aendern.asp"
        query:
          - name: ID
            flag_name: member-id
            type: string
            required: true
        response:
          type: string
      checkins:
        method: GET
        path: "/Mitglieder/Anwesenheit/Mitglied_Liste_anwesend.asp"
        query:
          - name: MitgliedID
            flag_name: member-id
            type: string
            required: true
        response:
          type: string

  prescriptions:
    description: Repräsentative Gesundheitsdaten-Lesezugriffe.
    endpoints:
      remaining_units:
        method: POST
        path: "/Statistiken/Verordnungen/Verordnung_Personen_Rest_Termine.asp"
        body:
          - name: Menge
            flag_name: threshold
            type: string
            required: true
        response:
          type: string

  compliance:
    description: Read-only Abrechnungsbereitschaftsprüfungen; reicht niemals eine Abrechnung ein.
    endpoints:
      billing_number_mismatches:
        method: GET
        path: "/Abrechnung_Reha_Digital/Abrechnungsnummern_Digital_Zeit_VO_pruefen.asp"
        response:
          type: string

  financial:
    description: Repräsentativer isolierter finanzieller Lesezugriff.
    endpoints:
      completed_digital_archive:
        method: GET
        path: "/Abrechnung_Reha_Digital/Aktive/Digital_Reha_Aktive_Abgerechnete_Liste.asp"
        query:
          - name: IK
            flag_name: ik
            type: string
            required: true
        response:
          type: string
