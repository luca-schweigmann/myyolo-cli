name: myyolo-admin
description: |
  Sanitized classic ASP administration contract used by myyolo-cli. The
  production runtime follows redirects manually, keeps cookies in the OS
  keyring, and permits only the exact read routes listed here.
version: "0.2.0"
base_url: "https://www.azh-myyolo.info"
spec_source: browser-sniffed

auth:
  type: none
  header: ""
  format: ""
  env_vars: []

config:
  format: toml
  path: "~/.config/myyolo-admin-pp-cli/config.toml"

resources:
  session:
    description: Establish an authorized classic ASP administration session.
    endpoints:
      login:
        method: POST
        path: "/Anmelden.asp?vw="
        description: |
          Form-encoded login. The production CLI counts the observed
          LoginHandler.asp and Start.asp redirect hops explicitly.
        body:
          - name: PartnerNummer
            flag_name: partner-number
            type: string
            required: true
          - name: Benutzername
            flag_name: username
            type: string
            required: true
          - name: Password
            flag_name: password
            type: string
            required: true
            description: Sensitive; never accepted as a production CLI argument.
        response:
          type: string

  attendance:
    description: Authorized, semantically read-only aggregate HTML pages.
    endpoints:
      current:
        method: GET
        path: "/Anwesenheit/Anwesend_Aktuell_Liste.asp"
        response:
          type: string
      today:
        method: GET
        path: "/Anwesenheit/Anwesend_Heute_Liste.asp"
        response:
          type: string
      dated:
        method: GET
        path: "/Anwesenheit/Anwesend_Datum_Liste.asp"
        response:
          type: string
      reha_dated:
        method: GET
        path: "/Anwesenheit/Reha_Anwesend_Datum_Liste.asp"
        response:
          type: string

  statistics:
    description: Authorized aggregate statistics and signature worklists.
    endpoints:
      course_participation_monthly:
        method: GET
        path: "/Statistiken/Kursplaner/Kurs_Teilnehmer_anwesend_monatlich.asp"
        response:
          type: string
      missing_reha_signatures:
        method: GET
        path: "/Vertrag_Reha/Unterschrift/Fehlende_Reha_Unterschriften_Liste.asp"
        response:
          type: string
