name: myyolo-admin
description: |
  Bereinigter klassischer ASP-Verwaltungsvertrag, den myyolo-cli nutzt. Die
  Produktions-Runtime folgt Weiterleitungen manuell, hält Cookies im
  OS-Schlüsselbund und erlaubt nur die hier gelisteten exakten Lese-Routen.
version: "0.3.0"
base_url: "https://www.azh-myyolo.info"
spec_source: browser-sniffed

auth:
  type: none
  header: ""
  format: ""
  env_vars: []

config:
  format: toml
  path: "~/.config/myyolo-admin-pp-cli/config.toml"

resources:
  session:
    description: Autorisierte klassische ASP-Verwaltungssitzung aufbauen.
    endpoints:
      login:
        method: POST
        path: "/Anmelden.asp?vw="
        description: |
          Form-kodiertes Login. Die Produktions-CLI zählt die beobachteten
          Weiterleitungssprünge über LoginHandler.asp und Start.asp explizit.
        body:
          - name: PartnerNummer
            flag_name: partner-number
            type: string
            required: true
          - name: Benutzername
            flag_name: username
            type: string
            required: true
          - name: Password
            flag_name: password
            type: string
            required: true
            description: Sensibel; wird niemals als Produktions-CLI-Argument akzeptiert.
        response:
          type: string

  attendance:
    description: Autorisierte, semantisch read-only aggregierte HTML-Seiten.
    endpoints:
      current:
        method: GET
        path: "/Anwesenheit/Anwesend_Aktuell_Liste.asp"
        response:
          type: string
      today:
        method: GET
        path: "/Anwesenheit/Anwesend_Heute_Liste.asp"
        response:
          type: string
      dated:
        method: GET
        path: "/Anwesenheit/Anwesend_Datum_Liste.asp"
        response:
          type: string
      reha_dated:
        method: GET
        path: "/Anwesenheit/Reha_Anwesend_Datum_Liste.asp"
        response:
          type: string

  statistics:
    description: Autorisierte Aggregatstatistiken und Unterschriften-Arbeitslisten.
    endpoints:
      course_participation_monthly:
        method: GET
        path: "/Statistiken/Kursplaner/Kurs_Teilnehmer_anwesend_monatlich.asp"
        response:
          type: string
      missing_reha_signatures:
        method: GET
        path: "/Vertrag_Reha/Unterschrift/Fehlende_Reha_Unterschriften_Liste.asp"
        response:
          type: string

  courses:
    description: Repräsentative Kurscontrolling-Lesezugriffe.
    endpoints:
      planner_week:
        method: GET
        path: "/Kursplaner_WEB/Wochenplaner_Tabelle_liste.asp?Raum="
        description: Source-advertised Datum navigation; empty Raum means all rooms. Runtime validates seven-day inventory.
        query:
          - name: Datum
            flag_name: date
            type: string
            required: false
        response:
          type: string
      definitions:
        method: GET
        path: "/Kursplaner/Kurse_Liste.asp"
        response:
          type: string
      history:
        method: GET
        path: "/Statistiken/Kursplaner/Kurs_Teilnehmer_anwesend_Kurs.asp"
        query:
          - name: KursID
            flag_name: course-id
            type: string
            required: true
        response:
          type: string

      attended_range:
        method: POST
        path: "/Kursplaner_Auswertungen/Kurs_Teilnehmer_anwesend.asp"
        description: Datumsbegrenzte Anwesenheitsliste; Personen- und Gesundheitsfreigabe erforderlich.
        body:
          - name: von
            flag_name: from
            type: string
            required: true
          - name: bis
            flag_name: to
            type: string
            required: true
        response:
          type: string
      not_attended_range:
        method: POST
        path: "/Kursplaner_Auswertungen/Kurs_Teilnehmer_nicht_anwesend.asp"
        description: Datumsbegrenzte Nicht-Anwesenheitsliste; Personen- und Gesundheitsfreigabe erforderlich.
        body:
          - name: von
            flag_name: from
            type: string
            required: true
          - name: bis
            flag_name: to
            type: string
            required: true
        response:
          type: string
      cancelled_range:
        method: POST
        path: "/Kursplaner_Auswertungen/Kurs_Teilnehmer_storniert.asp"
        description: Datumsbegrenzte Stornierungsliste; Personen- und Gesundheitsfreigabe erforderlich.
        body:
          - name: von
            flag_name: from
            type: string
            required: true
          - name: bis
            flag_name: to
            type: string
            required: true
        response:
          type: string
      planner_day:
        method: GET
        path: "/Kursplaner_WEB/Tagesplaner_Tabelle_liste.asp"
        description: Aktueller Tagesplaner; kein beliebiger Datumsparameter belegt. Personenfreigabe erforderlich.
        response:
          type: string
      day_list:
        method: POST
        path: "/Kursplaner/Listen/Kursplaner_Liste_Tag_anzeigen.asp"
        description: Druckliste fuer einen expliziten Tag; Personenfreigabe erforderlich.
        body:
          - name: von
            flag_name: date
            type: string
            required: true
        response:
          type: string
      session:
        method: GET
        path: "/Kursplaner_WEB/Kursplaner_Teilnehmer_eingabe.asp"
        description: |
          Nur exakt aus dem Planer referenzierte Sitzung lesen; Personen- und
          Gesundheitsfreigabe erforderlich. Der Runtime-Parser validiert die
          Teilnehmer-Tabelle und AW=anwesend_haken.png sowie die separate
          Unterschrift=unterschrift_gruen.png in derselben Zeile. Andere
          Farbmarker sind keine Anwesenheit. Siehe docs/reha-history.md.
        query:
          - name: Kurs
            flag_name: course-id
            type: string
            required: true
          - name: Datum
            flag_name: date
            type: string
            required: true
          - name: defaultMode
            flag_name: planner
            type: string
            required: false
        response:
          type: string

  members:
    description: Repräsentative personenbezogene Lesezugriffe; Produktion verlangt eine explizite Personen-Daten-Freigabe.
    endpoints:
      detail:
        method: GET
        path: "/Mitglieder/Mitglied_aendern.asp"
        query:
          - name: ID
            flag_name: member-id
            type: string
            required: true
        response:
          type: string
      checkins:
        method: GET
        path: "/Mitglieder/Anwesenheit/Mitglied_Liste_anwesend.asp"
        query:
          - name: MitgliedID
            flag_name: member-id
            type: string
            required: true
        response:
          type: string

  prescriptions:
    description: Repräsentative Gesundheitsdaten-Lesezugriffe.
    endpoints:
      remaining_units:
        method: POST
        path: "/Statistiken/Verordnungen/Verordnung_Personen_Rest_Termine.asp"
        body:
          - name: Menge
            flag_name: threshold
            type: string
            required: true
        response:
          type: string

  compliance:
    description: Read-only Abrechnungsbereitschaftsprüfungen; reicht niemals eine Abrechnung ein.
    endpoints:
      billing_number_mismatches:
        method: GET
        path: "/Abrechnung_Reha_Digital/Abrechnungsnummern_Digital_Zeit_VO_pruefen.asp"
        response:
          type: string

  financial:
    description: Repräsentativer isolierter finanzieller Lesezugriff.
    endpoints:
      completed_digital_archive:
        method: GET
        path: "/Abrechnung_Reha_Digital/Aktive/Digital_Reha_Aktive_Abgerechnete_Liste.asp"
        query:
          - name: IK
            flag_name: ik
            type: string
            required: true
        response:
          type: string
